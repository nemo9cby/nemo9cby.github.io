<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1823" media="(prefers-color-scheme: dark)">

{% seo %}

<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400;1,700&family=Mona+Sans:wdth,wght@75..125,200..900&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<script>document.documentElement.classList.add('js');</script>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
